name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # wrangler 4 requires >=22 in CI (fleet gotcha)

      - name: Install dependencies
        run: npm install

      # Cloudflare's asset upload occasionally fails with a transient API error (401 / "unknown error")
      # and succeeds on a re-run, so retry the deploy up to three times with a pause between attempts.
      - name: Deploy (with retry)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::wrangler deploy, attempt $attempt"
            if npx wrangler deploy; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          echo "deploy failed after 3 attempts"; exit 1
